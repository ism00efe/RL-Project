<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>evo player</title>
  <style>
    :root { --ink: #1d2126; --muted: #5f6872; --panel: rgba(255,255,255,0.82); --line: rgba(29,33,38,0.12); --accent: #d9733a; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #e9e6e1; color: var(--ink);
      font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    #stage { position: fixed; inset: 0; }
    .panel { position: fixed; background: var(--panel); backdrop-filter: blur(8px); border: 1px solid var(--line);
      border-radius: 10px; box-shadow: 0 4px 18px rgba(0,0,0,0.08); }
    #label { top: 16px; left: 16px; padding: 12px 16px; min-width: 200px; }
    #label h1 { margin: 0 0 6px; font-size: 18px; letter-spacing: 0.01em; }
    #label dl { display: grid; grid-template-columns: auto auto; gap: 2px 14px; margin: 0; font-size: 13px; }
    #label dt { color: var(--muted); }
    #label dd { margin: 0; font-variant-numeric: tabular-nums; }
    #controls { left: 50%; bottom: 16px; transform: translateX(-50%); padding: 8px 12px; display: flex; gap: 10px;
      align-items: center; width: min(720px, calc(100vw - 32px)); }
    #controls select, #controls button { font: inherit; border: 1px solid var(--line); background: #fff; border-radius: 6px;
      padding: 4px 8px; color: var(--ink); cursor: pointer; }
    #controls button { min-width: 64px; }
    #scrub { flex: 1; accent-color: var(--accent); min-width: 60px; }
    #time { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 44px; text-align: right; }
    #error { top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 16px 20px; display: none; max-width: 80vw; }
    @media (max-width: 560px) {
      #controls { flex-wrap: wrap; }
      #scrub { order: 5; flex-basis: 100%; }
    }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="label" class="panel">
    <h1 id="genome">—</h1>
    <dl>
      <dt>generation</dt><dd id="generation">—</dd>
      <dt>parent</dt><dd id="parent">—</dd>
      <dt>environment</dt><dd id="env">—</dd>
      <dt id="fitness-name">fitness</dt><dd id="fitness">—</dd>
    </dl>
  </div>
  <div id="controls" class="panel">
    <select id="pick" aria-label="recording"></select>
    <button id="play">Pause</button>
    <select id="speed" aria-label="speed">
      <option value="0.25">0.25×</option><option value="0.5">0.5×</option>
      <option value="1" selected>1×</option><option value="2">2×</option>
    </select>
    <input id="scrub" type="range" min="0" max="1" step="0.001" value="0" aria-label="time" />
    <span id="time">0.0s</span>
  </div>
  <div id="error" class="panel"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
