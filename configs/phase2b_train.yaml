# Step 2b.4: retrain the 4 example genomes with the muscle model (2b.2: cross-section torque, force-velocity limit,
# default max_joint_speed 15 rad/s) + energy cost (2b.3), strict sim (2b.1 showed it matters), no upright termination.
genomes: [genome/examples/quadruped.json, genome/examples/hexapod.json, genome/examples/snake.json, genome/examples/biped.json]
run_root: runs/phase2b
seed: 0
env_overrides: {energy_cost_weight: 1.0, sim_dt: 0.001, solver_iterations: 20, ls_iterations: 20, contact_timeconst: 0.005}
ppo:
  num_timesteps: 100000000
  num_evals: 6
  episode_length: 1000
  action_repeat: 1
  num_envs: 8192
  batch_size: 256
  num_minibatches: 32
  num_updates_per_batch: 4
  unroll_length: 20
  learning_rate: 0.0003
  entropy_cost: 0.01
  discounting: 0.97
  reward_scaling: 1.0
  max_grad_norm: 1.0
  normalize_observations: true
  num_resets_per_eval: 10
  network_factory:
    policy_hidden_layer_sizes: [512, 256, 128]
    value_hidden_layer_sizes: [512, 256, 128]
