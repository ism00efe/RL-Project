# Pinned to commit 619fcb2 (genome strength was gear in N·m; muscle model since 2b.2).
# Pipeline smoke test only (tiny budget). Not a real experiment.
genomes: [genome/examples/snake.json]
run_root: runs/phase2_smoke
seed: 0
env_overrides: {max_envs: 64}
ppo: {num_timesteps: 60000, num_evals: 3, episode_length: 100, action_repeat: 1, num_envs: 64, batch_size: 64,
