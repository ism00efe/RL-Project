      discounting: 0.97, reward_scaling: 1.0, max_grad_norm: 1.0, normalize_observations: true, num_resets_per_eval: 1,
      network_factory: {policy_hidden_layer_sizes: [32, 32], value_hidden_layer_sizes: [32, 32]}}
